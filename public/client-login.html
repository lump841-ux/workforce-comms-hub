<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client login — Workforce Communications Hub</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-topband">
    <img src="/brand-logo-compact.png" alt="Twanova" />
    <div class="band-name">Workforce Communications Hub — Client Login</div>
  </div>
  <div class="center-screen">
  <div class="auth-card">
    <p style="margin:0 0 16px;font-size:13.5px;color:var(--ink-soft);">
      One login works with every staffing agency you're connected to on Twanova.
    </p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username" />
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button class="btn btn-primary btn-block" style="margin-top:20px" type="submit">Sign in</button>
      <div id="msg"></div>
    </form>
    <div class="foot-link">
      New client company? <a href="/client-signup.html">Create your account</a><br/>
      Staffing agency? <a href="/login.html">Agency &amp; temp login</a>
    </div>
  </div>
  </div>
</div>
<script src="/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  try {
    const { user } = await api('/auth/login', {
      method: 'POST',
      body: { email: document.getElementById('email').value, password: document.getElementById('password').value }
    });
    if (user.role !== 'client_hr') {
      msg.innerHTML = `<div class="err">That account isn't a client login. Try the agency login page instead.</div>`;
      return;
    }
    window.location.href = '/client/dashboard.html';
  } catch (err) {
    msg.innerHTML = `<div class="err">${err.message}</div>`;
  }
});
</script>
</body>
</html>
