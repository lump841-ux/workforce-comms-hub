<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twanova Worker Mobile</title><style>body{margin:0;background:#f1f6fc;color:#17324e;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}.app{max-width:440px;margin:auto;min-height:100vh;background:white;padding:22px;box-sizing:border-box}header{font-weight:900;color:#082f5f;font-size:13px;letter-spacing:1px}h1{font-size:26px}p{color:#617990;line-height:1.5}.hero{height:145px;border-radius:18px;background:linear-gradient(90deg,#082b5ba8,#082b5b12),url(https://images.pexels.com/photos/4483610/pexels-photo-4483610.jpeg?auto=compress%26cs=tinysrgb%26w=800) center/cover;margin:20px 0}.card{border:1px solid #e1e9f1;border-radius:17px;padding:17px;margin:18px 0}.status{float:right;background:#e7f2ff;color:#1759a1;border-radius:20px;padding:6px 9px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;background:#edf5ff;border-radius:15px;padding:22px 10px;color:#153e67;font-weight:800;font-size:14px}.tile span{display:block;font-size:26px;margin-bottom:9px}input{width:100%;padding:13px;border:1px solid #bed0e2;border-radius:10px;box-sizing:border-box}button{cursor:pointer}.foot{margin-top:24px;display:flex;justify-content:space-around}a{color:#0a65ca}.msg{font-size:13px;color:#596f85}#actions{display:none}</style></head><body><div class="app"><header>TWANOVA WORKFORCE · CONNECTED BETA</header><h1 id="greet">Welcome</h1><p>Your shift and status updates, connected to your real agency account.</p><div class="hero"></div><div class="card"><b>Today's assignment</b><span class="status" id="status">Loading</span><h2 id="job">Checking...</h2><p id="details"></p></div><h3>Quick Actions</h3><div class="grid"><button class="tile" data-task="on-my-way"><span>🚙</span>On My Way</button><button class="tile" data-task="running-late"><span>⏰</span>Running Late</button><button class="tile" data-task="arrived"><span>📍</span>Arrived</button><button class="tile" data-task="clock-in"><span>✅</span>Clock In</button><button class="tile" data-task="breaks/start"><span>☕</span>Start Break</button><button class="tile" data-task="breaks/end"><span>▶️</span>End Break</button><button class="tile" data-task="clock-out"><span>🏁</span>Clock Out</button><button class="tile" onclick="location.href='/temp/dashboard.html'"><span>📷</span>Photos & More</button></div><div class="card" id="actions"><b id="actionName"></b><p>Confirm before submitting to Twanova.</p><div id="etaBox" hidden><label>Expected arrival time</label><input id="eta" placeholder="e.g. 7:20 AM"></div><p><button id="send">Confirm and Send</button> <button onclick="document.getElementById('actions').style.display='none'">Cancel</button></p></div><p class="msg" id="feedback">Live records load from your agency account.</p><div class="foot"><a href="/temp/dashboard.html">Shifts, Messages & Profile</a><a href="/login.html">Sign In</a></div></div><script>
let shift=null,task=null;
async function req(path,method='GET',payload){const r=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});if(r.status===401){location.href='/login.html';throw Error('Sign in required')}const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
async function refresh(){try{const [auth,shifts]=await Promise.all([req('/auth/me'),req('/temp/shifts')]);if(auth.user.role!=='temp'){location.href='/login.html';return}document.getElementById('greet').textContent='Hello, '+(auth.user.full_name||'Worker').split(' ')[0];shift=shifts.upcoming[0]||null;document.getElementById('job').textContent=shift?.job_title||'No upcoming assignment';document.getElementById('details').textContent=shift?[shift.shift_date,shift.start_time,shift.company_name,shift.site_name].filter(Boolean).join(' · '):'Your agency will add assignments here.';document.getElementById('status').textContent=shift?(shift.clock_in_at?'On Site':shift.arrived_at?'Arrived':shift.running_late_at?'Running Late':shift.en_route_at?'On My Way':shift.status):'No Shift'}catch(e){document.getElementById('feedback').textContent=e.message}}
document.querySelectorAll('[data-task]').forEach(b=>b.addEventListener('click',()=>{if(!shift){alert('No assignment yet');return}task=b.dataset.task;document.getElementById('actions').style.display='block';document.getElementById('actionName').textContent=b.textContent.trim();document.getElementById('etaBox').hidden=task!=='running-late';document.getElementById('actions').scrollIntoView({behavior:'smooth'})}));
document.getElementById('send').addEventListener('click',async()=>{if(!shift||!task)return;let payload={};if(task==='running-late'){payload.eta=document.getElementById('eta').value.trim();if(!payload.eta){alert('Enter an ETA');return}}const b=document.getElementById('send');b.disabled=true;try{await req('/temp/shifts/'+encodeURIComponent(shift.id)+'/'+task,'POST',payload);document.getElementById('actions').style.display='none';document.getElementById('feedback').textContent='Update saved to your agency shift record.';await refresh()}catch(e){alert('Update not sent: '+e.message)}finally{b.disabled=false}});
refresh();</script></body></html>
